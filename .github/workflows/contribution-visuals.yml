name: Refresh contribution visuals
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: public-profile-contribution-assets
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'Ap-95671/Ap-95671'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate the public contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: Ap-95671
          github_token: ${{ github.token }}
          outputs: |
            assets/activity/contribution-snake-light.svg?color_snake=#bd7f4d&color_dots=#ebedf0,#c6d1dc,#8ca4b9,#466a85,#17334d
            assets/activity/contribution-snake-dark.svg?palette=github-dark&color_snake=#e3a46a
      - name: Generate a static accessible calendar from the same GitHub source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/activity_snapshot.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-contribution-assets
          path: assets/activity/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-contribution-assets
          path: assets/activity/
      - name: Validate and publish only the four generated calendar files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_activity.py
